name: Refresh pitch scorecard
on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays, after the US market close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 update_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add site.html index.html
          git diff --cached --quiet || git commit -m "Refresh pitch scorecard prices"
          git push
